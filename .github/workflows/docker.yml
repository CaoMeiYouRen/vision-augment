name: Publish Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - master

# 仅取消针对当前工作流正在进行的作业或运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, smoke test and push
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase the repo name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >>${GITHUB_ENV}
      - name: Get short commit hash
        run: echo "TAG=sha-${GITHUB_SHA::7}" >>${GITHUB_ENV}

      # ── 原生多架构构建 ─────────────────────────────────────
      # 使用原始 Dockerfile，Buildx + QEMU 在各目标平台上完整执行
      # uv sync，确保 onnxruntime 等原生依赖按各架构正确解析。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 发布前冒烟：先构建当前平台镜像并加载到本地，跑容器验证 MCP 端点
      - name: Build and load image (smoke)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          tags: vision-augment:smoke
          cache-from: type=gha
      - name: Smoke test container (MCP initialize)
        run: |
          docker run -d --name va-smoke -p 127.0.0.1:8000:8000 vision-augment:smoke
          python3 - <<'EOF'
          import json, time, urllib.request

          url = "http://127.0.0.1:8000/mcp"
          payload = json.dumps({
              "jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {"protocolVersion": "2025-06-18", "capabilities": {},
                         "clientInfo": {"name": "ci", "version": "1"}},
          }).encode("utf-8")

          for _ in range(40):
              try:
                  req = urllib.request.Request(url, data=payload, headers={
                      "Accept": "application/json, text/event-stream",
                      "Content-Type": "application/json",
                  })
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      text = resp.read().decode("utf-8")
                  break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("MCP endpoint did not become ready")

          data = [line[6:] for line in text.splitlines() if line.startswith("data: ")]
          body = json.loads("\n".join(data))
          assert body["result"]["serverInfo"]["name"] == "vision-augment", body
          print("MCP initialize OK:", body["result"]["serverInfo"])
          EOF
          docker rm -f va-smoke

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to Alibaba Cloud Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}
      - name: Extract Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          # 发布到 docker.io / ghcr.io / registry.cn-hangzhou.aliyuncs.com
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
            registry.cn-hangzhou.aliyuncs.com/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value={{date 'YYYY-MM-DD' tz='Asia/Shanghai'}},enable=true
            type=sha,format=short,prefix=sha-,enable=true
          flavor: latest=false
      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Hub README & description sync
        uses: meeDamian/sync-readme@v1.0.6
        with:
          user: ${{ secrets.DOCKER_USERNAME }}
          pass: ${{ secrets.DOCKER_PASSWORD }}
          slug: ${{ github.repository }}
          description: "vision-augment: 本地优先的多模态视觉 MCP —— 为无视觉 LLM 提供可自定义端点的看图/OCR/文档解析能力"
